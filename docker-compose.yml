 services:
  postgres:
    image: postgres:15
    container_name: postgres_container
    environment:
      POSTGRES_PASSWORD: ecrnow@2024
      POSTGRES_DB: ecrNow
    ports:
      - "5432:5432"

  ecr-now:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecr-now
    depends_on:
      - postgres
    volumes:
      - C://ecr-now:/config
    environment:
      - logging.file.name=/config/ecrNow.log
      - ersd.file.location=/config/eRSDv3_specification_bundle.json
      - schematron.file.location=/config/CDAR2_IG_PHCASERPT_R2_STU1.1_SCHEMATRON.sch
      - xsd.schemas.location=/config/schemas/infrastructure/cda/CDA_SDTC.xsd
      - kar.directory=/config/kars
      - bsa.output.directory=/config/bsa-output/
      - custom-query.directory=/config/custom-queries
      - jdbc.url=jdbc:postgresql://postgres_container:5432/ecrNow
      - jdbc.username=postgres
      - jdbc.password=ecrnow@2024
      - security.key=test123
      - report-submission.endpoint
    ports:
      - "8081:8081"
